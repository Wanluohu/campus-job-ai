<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>客户信息列表</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; }
        table { border-collapse: collapse; margin: auto; width: 90%; }
        th, td { border: 1px solid #333; padding: 8px 12px; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .nav { text-align: center; margin: 20px 0; }
        .nav a { margin: 0 10px; text-decoration: none; color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body bgcolor="#e0ffff">
<div class="nav">
    <a href="/customer/list">客户列表</a>
    <a href="/customer/query">客户查询</a>
    <a href="/customer/add">添加客户</a>
    <a href="/customer/edit">修改客户</a>
    <a href="/customer/delete">删除客户</a>
</div>
<h3 style="text-align: center">客户信息列表</h3>
<table>
    <tr>
        <th>编号</th>
        <th>姓名</th>
        <th>性别</th>
        <th>年龄</th>
        <th>地址</th>
        <th>电话</th>
    </tr>
    <tr th:each="c : ${customerList}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.gender}"></td>
        <td th:text="${c.age}"></td>
        <td th:text="${c.address}"></td>
        <td th:text="${c.phone}"></td>
    </tr>
</table>
</body>
</html>
