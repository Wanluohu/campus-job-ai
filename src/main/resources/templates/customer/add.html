<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加客户</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; }
        .nav { text-align: center; margin: 20px 0; }
        .nav a { margin: 0 10px; text-decoration: none; color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body bgcolor="#e0ffff">
<div class="nav">
    <a href="/customer/list">客户列表</a>
    <a href="/customer/query">客户查询</a>
    <a href="/customer/add">添加客户</a>
    <a href="/customer/edit">修改客户</a>
    <a href="/customer/delete">删除客户</a>
</div>
<div style="text-align: center">
    <h3>添加客户信息</h3>
    <form action="/customer/add" method="post">
        <table style="text-align: center;margin: auto">
            <tr><td>姓名：</td><td><input type="text" name="name" required></td></tr>
            <tr><td>性别：</td><td><input type="text" name="gender"></td></tr>
            <tr><td>年龄：</td><td><input type="text" name="age"></td></tr>
            <tr><td>地址：</td><td><input type="text" name="address"></td></tr>
            <tr><td>电话：</td><td><input type="text" name="phone"></td></tr>
        </table>
        <br>
        <input type="submit" value="添加">&nbsp;&nbsp;
        <input type="reset" value="重置">
    </form>
</div>
</body>
</html>
