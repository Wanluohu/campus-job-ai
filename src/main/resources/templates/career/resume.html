<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 简历优化 - 校园求职助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;min-height:100vh;padding-bottom:40px}
        .section{padding:16px}
        .input-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}
        .label{font-size:15px;font-weight:600;color:#333;margin-bottom:10px;display:block}
        .tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
        .tag-btn{padding:8px 14px;border-radius:20px;font-size:13px;border:2px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;transition:all .15s}
        .tag-btn.active{background:#667eea;color:#fff;border-color:#667eea;font-weight:600}
        .tag-btn:active{transform:scale(.96)}
        .form-input{width:100%;padding:11px 12px;border-radius:8px;border:2px solid #e0e0e0;font-size:14px;color:#333}
        .form-input:focus{border-color:#667eea;outline:none}
        textarea{width:100%;min-height:240px;border:2px solid #e0e0e0;border-radius:10px;padding:14px;font-size:14px;line-height:1.8;color:#333;resize:vertical;font-family:inherit}
        textarea:focus{border-color:#667eea;outline:none}
        .btn-row{display:flex;gap:10px;margin-top:12px}
        .btn{flex:1;padding:12px;border-radius:10px;font-size:14px;border:none;text-align:center;cursor:pointer}
        .btn-outline{background:#fff;border:2px solid #ddd;color:#666}
        .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600}
        .btn:active{opacity:.8}.btn:disabled{opacity:.5}
        .count{text-align:right;font-size:12px;color:#999;margin-top:8px}
        .loading{display:flex;flex-direction:column;align-items:center;padding:40px}
        .dots{display:flex;gap:8px;margin-bottom:12px}
        .dots span{width:10px;height:10px;border-radius:50%;background:#667eea;animation:bounce 1.4s infinite ease-in-out}
        .dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        .loading-text{font-size:14px;color:#888;text-align:center}
        .result{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}
        .score-wrap{text-align:center;padding:24px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;margin-bottom:16px}
        .score-circle{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.2);border:4px solid rgba(255,255,255,.5);display:inline-flex;flex-direction:column;align-items:center;justify-content:center}
        .score-num{font-size:36px;font-weight:700;color:#fff;line-height:1}.score-unit{font-size:14px;color:rgba(255,255,255,.8)}.score-label{display:block;color:rgba(255,255,255,.9);font-size:14px;margin-top:8px}
        .dim-bar-wrap{margin-bottom:12px}
        .dim-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
        .dim-name{color:#333;font-weight:500}.dim-score{color:#667eea;font-weight:600}
        .dim-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
        .dim-fill{height:100%;border-radius:4px;transition:width .5s ease}
        .dim-comment{font-size:11px;color:#999;margin-top:2px}
        .section-title{font-size:16px;font-weight:600;color:#1a1a2e;margin-bottom:10px}
        .section-item{font-size:14px;color:#555;line-height:1.8;padding:3px 0}
        .optimized-box{background:#f0f4ff;border-radius:10px;padding:14px;border-left:4px solid #667eea;font-size:14px;line-height:1.9;color:#333;white-space:pre-wrap;margin-bottom:12px}
        .keyword-tag{display:inline-block;padding:6px 14px;border-radius:20px;background:#eef0ff;color:#667eea;font-size:13px;margin:4px 6px 4px 0;cursor:pointer;transition:all .15s}
        .keyword-tag:active{background:#667eea;color:#fff}
        .hidden{display:none}
        .example-box{background:#fffbe6;border-radius:10px;padding:12px;margin-top:12px;font-size:12px;color:#997404;line-height:1.7}
        .example-box b{color:#b8860b}
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div th:replace="career/fragments/topnav :: body"></div>

    <!-- 输入区 -->
    <div class="section" id="inputSection">
        <!-- 隐私声明 -->
        <div th:replace="career/fragments/privacy-banner :: body"></div>

        <div class="input-card">
            <!-- 场景选择 -->
            <span class="label">🎯 求职场景</span>
            <div class="tag-row" id="scenarioRow">
                <div class="tag-btn active" onclick="selScenario('fresh_graduate',this)">应届生</div>
                <div class="tag-btn" onclick="selScenario('experienced',this)">社招</div>
                <div class="tag-btn" onclick="selScenario('career_change',this)">转行</div>
                <div class="tag-btn" onclick="selScenario('intern',this)">实习</div>
                <div class="tag-btn" onclick="selScenario('part_time',this)">兼职</div>
            </div>

            <!-- 目标岗位 -->
            <span class="label">💼 目标岗位（选填）</span>
            <input class="form-input" id="targetPosition" placeholder="如：Java后端开发、产品经理...">
            <div style="height:14px"></div>

            <!-- 版本选择 -->
            <span class="label">📄 优化版本</span>
            <div class="tag-row" id="versionRow">
                <div class="tag-btn active" onclick="selVersion('full',this)">📝 完整版</div>
                <div class="tag-btn" onclick="selVersion('concise',this)">📋 精简版</div>
                <div class="tag-btn" onclick="selVersion('simple',this)">✨ 简洁版</div>
            </div>
            <div style="font-size:11px;color:#999;margin-bottom:12px" id="versionHint">完整重写所有模块，适合正式投递</div>

            <!-- 简历输入 -->
            <span class="label">📝 粘贴简历内容</span>
            <textarea id="resumeText" placeholder="请直接粘贴文本版简历内容（无需上传文件）&#10;&#10;粘贴内容示例：&#10;姓名：张三&#10;学校：XX大学 计算机科学 大三&#10;技能：Java、Spring Boot、MySQL&#10;项目经历：开发过学生管理系统...&#10;实习经历：XX公司Java开发实习生..."></textarea>
            <div class="count"><span id="charCount">0</span> 字</div>

            <div class="btn-row">
                <button class="btn btn-outline" onclick="pasteResume()">📋 粘贴</button>
                <button class="btn btn-outline" onclick="clearResume()">清空</button>
            </div>

            <!-- 示例引导 -->
            <div class="example-box">
                <b>💡 使用示例：</b>上面 textarea 里已经给了格式示范。简单说就是：<b>个人信息 + 教育背景 + 技能 + 项目经历 + 实习/工作经历 + 获奖</b>，纯文本粘贴即可。
            </div>

            <button class="btn btn-primary" style="width:100%;margin-top:14px;padding:14px;font-size:16px" id="analyzeBtn" onclick="analyze()">🔍 AI 分析简历</button>
        </div>
    </div>

    <!-- 加载区 -->
    <div class="section hidden" id="loadingSection">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span></div>
            <span class="loading-text">AI 正在分析你的简历...</span>
            <span style="font-size:12px;color:#999;margin-top:6px">预计等待 30-60 秒</span>
        </div>
    </div>

    <!-- 结果区 -->
    <div class="section hidden" id="resultSection"></div>

    <script th:inline="javascript">
        var scenario = 'fresh_graduate';
        var versionType = 'full';

        var txt = document.getElementById('resumeText');
        txt.addEventListener('input', function(){ document.getElementById('charCount').textContent = txt.value.length; });

        function selScenario(val, el) {
            scenario = val;
            document.querySelectorAll('#scenarioRow .tag-btn').forEach(function(b){ b.classList.remove('active'); });
            el.classList.add('active');
        }

        function selVersion(val, el) {
            versionType = val;
            document.querySelectorAll('#versionRow .tag-btn').forEach(function(b){ b.classList.remove('active'); });
            el.classList.add('active');
            var hints = {full:'完整重写所有模块，适合正式投递', concise:'200字以内提炼核心卖点，适合网申', simple:'仅优化措辞不改结构，适合快速修改'};
            document.getElementById('versionHint').textContent = hints[val] || '';
        }

        function pasteResume() {
            navigator.clipboard.readText().then(function(t){ txt.value += t; document.getElementById('charCount').textContent = txt.value.length; }).catch(function(){ alert('请先复制简历内容'); });
        }

        function clearResume() {
            txt.value = '';
            document.getElementById('charCount').textContent = 0;
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('resultSection').innerHTML = '';
            document.getElementById('inputSection').classList.remove('hidden');
            document.getElementById('loadingSection').classList.add('hidden');
        }

        async function analyze() {
            var text = txt.value.trim();
            if (!text) return alert('请粘贴简历内容');
            if (text.length < 20) return alert('简历内容太短，至少20个字');

            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            try {
                var res = await fetch('/api/career/resume/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        resume: text,
                        scenario: scenario,
                        versionType: versionType,
                        targetPosition: document.getElementById('targetPosition').value.trim()
                    })
                });
                var data = await res.json();
                document.getElementById('loadingSection').classList.add('hidden');
                if (data.code === 200) {
                    showResult(data.data);
                    document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
                } else {
                    alert(data.msg || '分析失败');
                    document.getElementById('inputSection').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('loadingSection').classList.add('hidden');
                alert('网络错误，请重试');
                document.getElementById('inputSection').classList.remove('hidden');
            }
        }

        function showResult(d) {
            var html = '';
            // 总分
            html += '<div class="score-wrap"><div class="score-circle"><span class="score-num">'+(d.score||'--')+'</span><span class="score-unit">分</span></div><span class="score-label">综合评分</span></div>';

            // 五维度评分条
            if (d.dimensions) {
                html += '<div class="result"><div class="section-title">📊 分维度评分</div>';
                var keys = ['wording','matching','structure','highlights','grammar'];
                var colors = ['#667eea','#f5a623','#2ecc71','#e74c3c','#3498db'];
                for (var i = 0; i < keys.length; i++) {
                    var dim = d.dimensions[keys[i]];
                    if (!dim) continue;
                    html += '<div class="dim-bar-wrap">';
                    html += '<div class="dim-header"><span class="dim-name">'+dim.label+'</span><span class="dim-score">'+dim.score+'分</span></div>';
                    html += '<div class="dim-bar"><div class="dim-fill" style="width:'+dim.score+'%;background:'+colors[i]+'"></div></div>';
                    html += '<div class="dim-comment">'+dim.comment+'</div>';
                    html += '</div>';
                }
                html += '</div>';
            }

            // 关键词
            if (d.keywords && d.keywords.length) {
                html += '<div class="result"><div class="section-title">🏷️ 提取关键词</div>';
                for (var i = 0; i < d.keywords.length; i++) {
                    html += '<span class="keyword-tag" onclick="copyText(\''+escapeAttr(d.keywords[i])+'\')">'+escapeHtml(d.keywords[i])+'</span>';
                }
                html += '<div style="margin-top:8px"><button class="btn btn-outline" style="font-size:12px;padding:6px 12px" onclick="copyAllKeywords()">📋 一键复制全部关键词</button></div>';
                html += '</div>';
            }

            // 优点
            if (d.strengths && d.strengths.length) {
                html += '<div class="result"><div class="section-title">✅ 优点</div>';
                d.strengths.forEach(function(s){ html += '<div class="section-item">• '+escapeHtml(s)+'</div>'; });
                html += '</div>';
            }
            // 不足
            if (d.weaknesses && d.weaknesses.length) {
                html += '<div class="result"><div class="section-title">⚠️ 不足</div>';
                d.weaknesses.forEach(function(w){ html += '<div class="section-item">• '+escapeHtml(w)+'</div>'; });
                html += '</div>';
            }
            // 建议
            if (d.suggestions && d.suggestions.length) {
                html += '<div class="result"><div class="section-title">💡 修改建议</div>';
                d.suggestions.forEach(function(s){ html += '<div class="section-item">• '+escapeHtml(s)+'</div>'; });
                html += '</div>';
            }
            // 优化版
            if (d.optimizedVersion) {
                html += '<div class="result"><div class="section-title">✨ 优化后的简历</div><div class="optimized-box">'+escapeHtml(d.optimizedVersion).replace(/\n/g,'<br>')+'</div><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="copyOptimized()">📋 复制优化版简历</button></div>';
            }
            // 重新分析
            html += '<button class="btn btn-outline" style="width:100%;margin-top:8px;padding:14px" onclick="clearResume()">🔄 重新分析</button>';

            document.getElementById('resultSection').innerHTML = html;
            document.getElementById('resultSection').classList.remove('hidden');
            window._optimizedVersion = d.optimizedVersion;
            window._allKeywords = d.keywords;
        }

        function copyOptimized() {
            if (window._optimizedVersion) {
                navigator.clipboard.writeText(window._optimizedVersion).then(function(){ alert('已复制优化版简历'); });
            }
        }

        function copyAllKeywords() {
            if (window._allKeywords && window._allKeywords.length) {
                navigator.clipboard.writeText(window._allKeywords.join('、')).then(function(){ alert('已复制全部关键词'); });
            }
        }

        function copyText(t) {
            navigator.clipboard.writeText(t).then(function(){ alert('已复制: '+t); });
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
