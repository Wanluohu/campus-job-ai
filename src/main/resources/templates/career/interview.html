<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 面试模拟 - 校园求职助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column}
        .nav-spacer{flex-shrink:0}
        .setup{padding:20px 16px;flex:1}
        .setup-card{background:#fff;border-radius:16px;padding:24px 18px;text-align:center}
        .setup-icon{font-size:60px;margin-bottom:12px}
        .setup-title{font-size:20px;font-weight:700;color:#1a1a2e;display:block;margin-bottom:6px}
        .setup-desc{font-size:13px;color:#888;display:block;margin-bottom:20px}
        .form-group{text-align:left;margin-bottom:16px}
        .form-label{display:block;font-size:14px;font-weight:600;color:#333;margin-bottom:6px}
        select{width:100%;padding:12px;border-radius:10px;border:2px solid #e0e0e0;font-size:15px;color:#333;background:#f9f9f9}
        .tag-row{display:flex;flex-wrap:wrap;gap:8px}
        .tag-btn{padding:10px 14px;border-radius:20px;font-size:13px;border:2px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;transition:all .15s;white-space:nowrap}
        .tag-btn.active{background:#667eea;color:#fff;border-color:#667eea;font-weight:600}
        .tips{background:#f0f4ff;border-radius:10px;padding:14px;text-align:left;margin:16px 0}
        .tips-title{font-size:13px;font-weight:600;color:#667eea;display:block;margin-bottom:6px}
        .tips-item{font-size:12px;color:#666;line-height:1.8;display:block}
        .btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:600;border:none;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer}
        .btn:active{opacity:.8}.btn:disabled{opacity:.5}
        .chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .chat-banner{text-align:center;padding:8px 12px;background:#f0f4ff;font-size:12px;color:#667eea}
        .progress-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
        .progress-bar{width:120px;height:4px;background:#ddd;border-radius:2px;overflow:hidden}
        .progress-fill{height:100%;background:#667eea;border-radius:2px;transition:width .3s}
        .msg-list{flex:1;overflow-y:auto;padding:12px}
        .msg{display:flex;margin-bottom:16px}.msg.user{flex-direction:row-reverse}
        .msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
        .msg.interviewer .msg-avatar{margin-right:8px}.msg.user .msg-avatar{margin-left:8px}
        .bubble{max-width:78%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap}
        .bubble.interviewer{background:#fff;color:#333;border-bottom-left-radius:4px}
        .bubble.user{background:#667eea;color:#fff;border-bottom-right-radius:4px}
        .done-msg{text-align:center;padding:20px}
        .done-icon{font-size:50px}.done-text{font-size:16px;font-weight:600;color:#1a1a2e;margin:8px 0}
        .input-bar{display:flex;align-items:center;padding:10px 12px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
        .input-bar input{flex:1;height:40px;border-radius:20px;border:none;background:#f5f5f5;padding:0 16px;font-size:14px;color:#333}
        .input-bar button{margin-left:8px;height:40px;padding:0 18px;border-radius:20px;border:none;background:#ddd;color:#999;font-size:14px;font-weight:600}
        .input-bar button.active{background:#667eea;color:#fff}
        .hidden{display:none}
        .loading-dots{display:flex;gap:6px;padding:12px}
        .loading-dots span{width:8px;height:8px;border-radius:50%;background:#667eea;animation:bounce 1.4s infinite ease-in-out}
        .loading-dots span:nth-child(2){animation-delay:.16s}.loading-dots span:nth-child(3){animation-delay:.32s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        .eval-dim{display:flex;align-items:center;gap:8px;padding:4px 0}
        .eval-stars{color:#f5a623;font-size:14px}
        .eval-label{font-size:13px;color:#555;flex:1}
    </style>
</head>
<body>
    <div class="nav-spacer" th:replace="career/fragments/topnav :: body"></div>

    <!-- 设置阶段 -->
    <div id="setupSection">
        <div class="setup">
            <div class="setup-card">
                <div class="setup-icon">🤖</div>
                <span class="setup-title">AI 模拟面试官</span>
                <span class="setup-desc">选择面试类型，AI 进行专业模拟面试</span>

                <div class="form-group">
                    <span class="form-label">面试类型</span>
                    <select id="interviewType">
                        <option value="campus_single">校招单面</option>
                        <option value="campus_group">校招群面（无领导小组）</option>
                        <option value="tech">社招技术面</option>
                        <option value="hr">HR 面</option>
                        <option value="part_time">兼职面试</option>
                    </select>
                </div>

                <div class="form-group">
                    <span class="form-label">目标岗位</span>
                    <select id="jobType">
                        <option>后端开发</option><option>前端开发</option><option>产品经理</option><option>数据分析</option><option>市场营销</option><option>运营</option><option>人力资源</option><option>金融</option><option>通用岗位</option>
                    </select>
                </div>

                <div class="form-group">
                    <span class="form-label">面试难度</span>
                    <div class="tag-row" id="diffRow">
                        <div class="tag-btn active" onclick="selDiff('初级',this)">初级</div>
                        <div class="tag-btn" onclick="selDiff('中级',this)">中级</div>
                        <div class="tag-btn" onclick="selDiff('高级',this)">高级</div>
                    </div>
                </div>

                <div class="form-group">
                    <span class="form-label">面试轮数</span>
                    <div class="tag-row" id="roundRow">
                        <div class="tag-btn" onclick="selRound(3,this)">3轮 · 快速</div>
                        <div class="tag-btn active" onclick="selRound(5,this)">5轮 · 标准</div>
                        <div class="tag-btn" onclick="selRound(8,this)">8轮 · 深度</div>
                    </div>
                </div>

                <div class="form-group">
                    <span class="form-label">提问模式</span>
                    <div class="tag-row" id="modeRow">
                        <div class="tag-btn active" onclick="selMode('free',this)">自由提问</div>
                        <div class="tag-btn" onclick="selMode('bank',this)">常见题库</div>
                    </div>
                </div>

                <!-- 隐私声明 -->
                <div th:replace="career/fragments/privacy-banner :: body" style="text-align:left"></div>

                <button class="btn" onclick="startInterview()">🚀 开始面试</button>
            </div>
        </div>
    </div>

    <!-- 面试阶段 -->
    <div id="chatSection" class="hidden" style="flex:1;display:flex;flex-direction:column">
        <div class="chat-banner">
            <span id="chatBannerText">面试中</span>
            <div class="progress-wrap">
                <span style="font-size:11px;color:#999">第</span>
                <span style="font-size:13px;font-weight:600;color:#667eea" id="progressNum">1</span>
                <span style="font-size:11px;color:#999">/</span>
                <span style="font-size:11px;color:#999" id="progressTotal">5</span>
                <span style="font-size:11px;color:#999">轮</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            </div>
            <span style="font-size:10px;color:#aaa;display:block;margin-top:2px" id="modeLabel">自由提问模式</span>
        </div>
        <div class="msg-list" id="msgList"></div>
        <div class="input-bar" id="inputBar">
            <input id="answerInput" placeholder="输入你的回答..." onkeydown="if(event.key==='Enter')sendAnswer()">
            <button id="sendBtn" onclick="sendAnswer()">回答</button>
        </div>
    </div>

    <script th:inline="javascript">
        var sessionId = '', jobType = '后端开发', difficulty = '初级', interviewType = 'campus_single', roundCount = 5, mode = 'free', interviewDone = false;

        function selDiff(d, el) { difficulty = d; document.querySelectorAll('#diffRow .tag-btn').forEach(function(b){ b.classList.remove('active'); }); el.classList.add('active'); }
        function selRound(n, el) { roundCount = n; document.querySelectorAll('#roundRow .tag-btn').forEach(function(b){ b.classList.remove('active'); }); el.classList.add('active'); }
        function selMode(m, el) { mode = m; document.querySelectorAll('#modeRow .tag-btn').forEach(function(b){ b.classList.remove('active'); }); el.classList.add('active'); }

        async function startInterview() {
            jobType = document.getElementById('jobType').value;
            interviewType = document.getElementById('interviewType').value;
            var typeNames = {campus_single:'校招单面', campus_group:'校招群面', tech:'社招技术面', hr:'HR面', part_time:'兼职面试'};
            document.getElementById('chatBannerText').textContent = '🎯 ' + typeNames[interviewType] + ' · ' + jobType;
            document.getElementById('progressTotal').textContent = roundCount;
            document.getElementById('modeLabel').textContent = mode === 'free' ? '自由提问模式' : '常见题库模式';
            document.getElementById('progressNum').textContent = '1';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('chatSection').classList.remove('hidden');
            document.getElementById('chatSection').style.display = 'flex';
            addMsg('interviewer', '🤖 面试官正在准备题目...');

            try {
                var res = await fetch('/api/career/interview/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({jobType: jobType, difficulty: difficulty, interviewType: interviewType, roundCount: roundCount, mode: mode})
                });
                var data = await res.json();
                document.getElementById('msgList').lastChild.remove();
                if (data.code === 200) {
                    sessionId = data.data.sessionId;
                    addMsg('interviewer', data.data.question);
                    updateProgress(1);
                } else {
                    addMsg('interviewer', '❌ ' + (data.msg || '启动失败'));
                }
            } catch (e) {
                document.getElementById('msgList').lastChild.remove();
                addMsg('interviewer', '❌ 网络错误，请重试');
            }
        }

        async function sendAnswer() {
            if (interviewDone) return;
            var input = document.getElementById('answerInput');
            var answer = input.value.trim();
            if (!answer) return;
            addMsg('user', answer); input.value = '';
            var loadingEl = addLoading();
            try {
                var res = await fetch('/api/career/interview/answer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({sessionId: sessionId, answer: answer})
                });
                var data = await res.json();
                loadingEl.remove();
                if (data.code === 200) {
                    if (data.data.isComplete) {
                        interviewDone = true;
                        addMsg('interviewer', data.data.overallEvaluation);
                        updateProgress(data.data.questionNumber);
                        showDone();
                    } else {
                        addMsg('interviewer', data.data.feedback);
                        updateProgress(data.data.questionNumber);
                    }
                } else {
                    addMsg('interviewer', '❌ ' + (data.msg || '处理失败'));
                }
            } catch (e) {
                loadingEl.remove();
                addMsg('interviewer', '❌ 网络错误，请重试');
            }
        }

        function updateProgress(current) {
            document.getElementById('progressNum').textContent = current;
            document.getElementById('progressFill').style.width = (current / roundCount * 100) + '%';
        }

        function addMsg(role, text) {
            var el = document.createElement('div');
            el.className = 'msg ' + role;
            el.innerHTML = '<div class="msg-avatar">' + (role === 'interviewer' ? '🤖' : '👤') + '</div><div class="bubble ' + role + '">' + escapeHtml(text) + '</div>';
            document.getElementById('msgList').appendChild(el);
            el.scrollIntoView({behavior:'smooth'});
        }

        function addLoading() {
            var el = document.createElement('div');
            el.className = 'msg interviewer';
            el.innerHTML = '<div class="msg-avatar">🤖</div><div class="bubble interviewer"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
            document.getElementById('msgList').appendChild(el);
            el.scrollIntoView({behavior:'smooth'});
            return el;
        }

        function showDone() {
            document.getElementById('inputBar').style.display = 'none';
            var el = document.createElement('div');
            el.className = 'done-msg';
            el.innerHTML = '<div class="done-icon">🎉</div><div class="done-text">面试已完成！</div><button class="btn" style="margin-top:12px;margin-bottom:6px" onclick="restart()">🔄 换个类型再来</button><button class="btn" style="background:#fff;color:#667eea;border:2px solid #667eea" onclick="retrySame()">🔁 相同设置再来</button>';
            document.getElementById('msgList').appendChild(el);
            el.scrollIntoView({behavior:'smooth'});
        }

        function restart() {
            sessionId = ''; interviewDone = false;
            document.getElementById('msgList').innerHTML = '';
            document.getElementById('inputBar').style.display = 'flex';
            document.getElementById('answerInput').value = '';
            document.getElementById('chatSection').classList.add('hidden');
            document.getElementById('chatSection').style.display = 'none';
            document.getElementById('setupSection').classList.remove('hidden');
        }

        function retrySame() {
            sessionId = ''; interviewDone = false;
            document.getElementById('msgList').innerHTML = '';
            document.getElementById('inputBar').style.display = 'flex';
            document.getElementById('answerInput').value = '';
            document.getElementById('progressNum').textContent = '1';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('chatSection').classList.add('hidden');
            document.getElementById('chatSection').style.display = 'none';
            document.getElementById('setupSection').classList.remove('hidden');
            setTimeout(function(){ startInterview(); }, 500);
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
