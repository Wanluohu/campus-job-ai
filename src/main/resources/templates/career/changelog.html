<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>更新日志 - 校园求职助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;min-height:100vh;padding-bottom:40px}
        .section{padding:16px}
        .timeline{position:relative;padding-left:24px}
        .timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:#e0e0e0}
        .version-card{position:relative;background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
        .version-dot{position:absolute;left:-20px;top:22px;width:14px;height:14px;border-radius:50%;background:#667eea;border:3px solid #fff;box-shadow:0 0 0 2px #667eea}
        .version-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
        .version-num{font-size:18px;font-weight:700;color:#667eea}
        .version-date{font-size:12px;color:#999}
        .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
        .ver-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef0ff;color:#667eea}
        .change-list{list-style:none;padding:0}
        .change-item{font-size:14px;color:#555;line-height:1.8;padding:2px 0}
        .change-item::before{content:'• ';color:#667eea;font-weight:bold}
        .loading-text{text-align:center;color:#999;padding:40px;font-size:14px}
    </style>
</head>
<body>
    <div th:replace="career/fragments/topnav :: body"></div>

    <div class="section">
        <span style="font-size:20px;font-weight:700;color:#1a1a2e;display:block;margin-bottom:16px">📋 更新日志</span>
        <div class="timeline" id="timeline">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <script th:inline="javascript">
        async function loadChangelog() {
            try {
                var res = await fetch('/api/career/changelog');
                var data = await res.json();
                if (data.code === 200 && data.data.versions) {
                    renderTimeline(data.data.versions);
                }
            } catch (e) {
                document.getElementById('timeline').innerHTML = '<div class="loading-text">加载失败，请刷新重试</div>';
            }
        }

        function renderTimeline(versions) {
            var html = '';
            versions.forEach(function(v) {
                html += '<div class="version-card">';
                html += '<div class="version-dot"></div>';
                html += '<div class="version-header"><span class="version-num">' + escapeHtml(v.version) + '</span><span class="version-date">' + escapeHtml(v.date) + '</span></div>';
                if (v.tags && v.tags.length) {
                    html += '<div class="tag-row">';
                    v.tags.forEach(function(t) { html += '<span class="ver-tag">' + escapeHtml(t) + '</span>'; });
                    html += '</div>';
                }
                html += '<ul class="change-list">';
                v.changes.forEach(function(c) { html += '<li class="change-item">' + escapeHtml(c) + '</li>'; });
                html += '</ul></div>';
            });
            document.getElementById('timeline').innerHTML = html;
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadChangelog();
    </script>
</body>
</html>
