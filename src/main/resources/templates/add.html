<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加食品</title>
</head>
<body bgcolor="#e0ffff">
<br>
<div style="text-align: center">
    <h3>添加食品信息</h3>
    <form action="/addform" method="post">
        <table style="text-align: center;margin: auto">
            <tr><td>名称：</td><td><input type="text" name="name"></td></tr>
            <tr><td>类型：</td><td><input type="text" name="type"></td></tr>
            <tr><td>状态：</td><td><input type="text" name="state"></td></tr>
            <tr><td>价格：</td><td><input type="text" name="price"></td></tr>
            <tr><td>库存量：</td><td><input type="text" name="quantity"></td></tr>
        </table>
        <br>
        <input type="submit" value="添加">&nbsp;&nbsp;
        <input type="reset" value="重置">
    </form>
</div>
</body>
</html>
